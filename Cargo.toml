[workspace]
resolver = "3"
members = [
    "crates/viana-protocol",
    "crates/viana-media",
    "crates/viana-ha",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "native-tls", "http2", "charset", "json"] }
quick-xml = "0.36"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "native-tls"] }
native-tls = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
toml = "0.8"
rand = "0.8"
async-stream = "0.3"
